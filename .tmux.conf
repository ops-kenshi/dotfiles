# set -g mouse on

setw -g mode-keys vi
bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane

bind -n C-Left split-window -hb -c "#{pane_current_path}"
bind -n C-Right split-window -h -c "#{pane_current_path}"
bind -n C-Up split-window -vb -c "#{pane_current_path}"
bind -n C-Down split-window -v -c "#{pane_current_path}"

bind -n C-h previous-window
bind -n C-l next-window

# Ghostty sends Ctrl+Shift+h as C-S-h normally, but as C-S-H once tmux enables modifyOtherKeys
bind -n C-S-h select-pane -L
bind -n C-S-H select-pane -L
bind -n C-S-l select-pane -R
bind -n C-S-L select-pane -R
bind -n C-S-k select-pane -U
bind -n C-S-K select-pane -U
bind -n C-S-j select-pane -D
bind -n C-S-J select-pane -D

# Browser-style ctrl+tab over windows in all sessions: a popup lists recent windows, tab / shift+tab
# switch through them live, letting go of ctrl (or Enter) stays on the highlighted one and Esc goes back
set-hook -g session-window-changed {
  if -F "#{session_attached}" {
    run-shell "~/.config/tmux/window-mru.sh touch '#{session_id}:#{window_id}'"
  }
}
set-hook -g client-session-changed { run-shell "~/.config/tmux/window-mru.sh touch '#{session_id}:#{window_id}'" }
set-hook -g client-attached { run-shell "~/.config/tmux/window-mru.sh touch '#{session_id}:#{window_id}'" }
bind -n C-Tab run-shell -b "~/.config/tmux/window-mru.sh open next '#{client_name}' '#{session_id}:#{window_id}'"
# ctrl+shift+tab may arrive as either name depending on how the shift is encoded
bind -n C-BTab run-shell -b "~/.config/tmux/window-mru.sh open prev '#{client_name}' '#{session_id}:#{window_id}'"
bind -n C-S-Tab run-shell -b "~/.config/tmux/window-mru.sh open prev '#{client_name}' '#{session_id}:#{window_id}'"
bind -n C-w switch-client -T split-mode
bind -T split-mode x kill-pane
bind -T split-mode s display-popup -E -w 40% -h 40% "tmux list-windows -a -F '#{session_name}:#{window_index} #{session_name}:#{window_name}' | fzf --with-nth=2 | cut -d' ' -f1 | xargs tmux switch-client -t"
bind -T split-mode r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind -T split-mode c new-window
bind -T split-mode 0 select-window -t :=0
bind -T split-mode 1 select-window -t :=1
bind -T split-mode 2 select-window -t :=2
bind -T split-mode 3 select-window -t :=3
bind -T split-mode 4 select-window -t :=4
bind -T split-mode 5 select-window -t :=5
bind -T split-mode 6 select-window -t :=6
bind -T split-mode 7 select-window -t :=7
bind -T split-mode 8 select-window -t :=8
bind -T split-mode 9 select-window -t :=9
bind -T split-mode "'" command-prompt -T window-target -p index { select-window -t ":%%" }
bind -T split-mode , command-prompt -I "#W" "rename-window -- '%%'"
bind -T split-mode n switch-client -n
bind -T split-mode p switch-client -p
bind -T split-mode = resize-pane -R 5
bind -T split-mode - resize-pane -L 5

set -g focus-events on

set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=red'
set -g pane-border-lines heavy

# tmux 3.8 defaults popups to bg=themedarkgrey; keep them on the terminal's own background
set -g popup-style 'bg=default,fg=default'
set -g popup-border-style 'bg=default,fg=colour238'

# Pass Ctrl+[ through as its own key so nvim can map it apart from Esc
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'

set -g status-style 'bg=#50C878,fg=black'

set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-style 'fg=black,bold'
set -g window-status-current-style 'bg=red,fg=black,bold'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
