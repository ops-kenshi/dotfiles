[[mgr.prepend_keymap]]
on   = "<C-y>"
run  = '''shell "osascript -e 'on run {p}' -e 'tell application \"Finder\" to set the clipboard to (POSIX file p as alias)' -e 'end run' %s1"'''
desc = "Copy file to system clipboard"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the directory or open the file"

[[mgr.prepend_keymap]]
on   = "<Backspace>"
run  = "leave"
desc = "Go back to the parent directory"
